<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te amo Erika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --night-top: #0a1424;
    --night-mid: #10302f;
    --night-low: #1a4a3a;
    --cream: #fff2d8;
    --gold: #ffd96a;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--night-top);
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  body {
    background: linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 62%, var(--night-low) 100%);
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--cream);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .title {
    position: fixed;
    left: 0; right: 0;
    top: calc(11% + env(safe-area-inset-top, 0px));
    text-align: center;
    font-family: "Great Vibes", "Snell Roundhand", cursive;
    font-size: clamp(3rem, 12vw, 7.5rem);
    line-height: 1.1;
    color: var(--cream);
    text-shadow: 0 0 24px rgba(255, 217, 106, .55), 0 0 60px rgba(255, 180, 90, .25);
    pointer-events: none;
    padding: 0 1rem;
  }
  .title span {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px) scale(.9);
    filter: blur(6px);
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1), filter 1.1s ease;
    white-space: pre;
  }
  .title.on span { opacity: 1; transform: none; filter: none; }

  .start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.6rem;
    transition: opacity .8s ease;
    pointer-events: none;
  }
  .start.gone { opacity: 0; }
  .bud {
    width: 74px; height: 74px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 217, 106, .8);
    position: relative;
    animation: pulse 2.2s ease-out infinite;
  }
  .bud::after {
    content: "";
    position: absolute; inset: 22px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 22px 6px rgba(255, 217, 106, .6);
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255, 217, 106, .45); }
    100% { box-shadow: 0 0 0 46px rgba(255, 217, 106, 0); }
  }
  .start p {
    font-weight: 300;
    font-size: 1.05rem;
    letter-spacing: .04em;
    opacity: .9;
  }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: .85rem;
    font-weight: 300;
    opacity: 0;
    transition: opacity 1.4s ease;
    pointer-events: none;
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .hint.on { opacity: .75; }

  @media (prefers-reduced-motion: reduce) {
    .bud { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="start" id="start">
  <div class="bud"></div>
  <p>Toca para empezar</p>
</div>

<h1 class="title" id="title" aria-live="polite"></h1>
<div class="hint" id="hint">Toca donde quieras para plantar más flores</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const startEl = document.getElementById('start');
  const titleEl = document.getElementById('title');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  /* ---------- Paletas ---------- */
  const LILY = [
    ['#fffaf5', '#f7c6d6'],
    ['#fff6ef', '#f4a9c2'],
    ['#ffffff', '#e9d6f5'],
    ['#fff8e8', '#ffd0a8'],
  ];
  const GERBERA = [
    ['#ff5a5f', '#ff8a7a'],
    ['#ff8c2b', '#ffb55c'],
    ['#ff4f9a', '#ff8cc0'],
    ['#ffb3c7', '#ffd6e0'],
    ['#e8384f', '#ff6f7c'],
  ];
  const AZALEA = [
    ['#ffcf1f', '#fff08a'],
    ['#ffbf00', '#ffe266'],
  ];

  /* ---------- Formas ---------- */
  function petalPath(len, w, pointy = 0.5) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(w, -len * 0.25, w * (1 - pointy * 0.4), -len * (0.75 + pointy * 0.1), 0, -len);
    ctx.bezierCurveTo(-w * (1 - pointy * 0.4), -len * (0.75 + pointy * 0.1), -w, -len * 0.25, 0, 0);
    ctx.closePath();
  }

  function drawLily(s, pal, open, seed) {
    ctx.scale(1, 0.82);
    // pétalos traseros y delanteros
    for (let layer = 0; layer < 2; layer++) {
      for (let i = 0; i < 3; i++) {
        const a = (i * 120 + layer * 60 + seed * 7) * Math.PI / 180;
        ctx.save();
        ctx.rotate(a);
        const len = s * (layer ? 1 : 0.95) * open;
        const w = s * 0.34 * open;
        const g = ctx.createLinearGradient(0, 0, 0, -len);
        g.addColorStop(0, '#ffe98a');
        g.addColorStop(0.25, pal[0]);
        g.addColorStop(1, pal[1]);
        ctx.fillStyle = g;
        petalPath(len, w, 0.9);
        ctx.fill();
        ctx.strokeStyle = 'rgba(200,110,140,.35)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // vena central
        ctx.beginPath();
        ctx.moveTo(0, -len * 0.08);
        ctx.lineTo(0, -len * 0.8);
        ctx.strokeStyle = 'rgba(210,150,90,.45)';
        ctx.stroke();
        // pecas
        ctx.fillStyle = 'rgba(190,80,110,.55)';
        for (let k = 0; k < 6; k++) {
          ctx.beginPath();
          ctx.arc(rand(-w * .25, w * .25), -len * rand(.15, .45), s * 0.012 + .5, 0, 7);
          ctx.fill();
        }
        ctx.restore();
      }
    }
    // estambres
    for (let i = 0; i < 6; i++) {
      const a = (i * 60 + 20) * Math.PI / 180;
      const l = s * 0.55 * open;
      const x = Math.sin(a) * l, y = -Math.cos(a) * l;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(x * 0.4, y * 0.5, x, y);
      ctx.strokeStyle = '#f4f0d0';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a);
      ctx.fillStyle = '#b5561f';
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.04, s * 0.1, 0, 0, 7);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawGerbera(s, pal, open, seed) {
    ctx.scale(1, 0.9);
    const rings = [
      { n: 26, len: 1.0, w: 0.085, off: 0 },
      { n: 26, len: 0.86, w: 0.085, off: 0.5 },
      { n: 20, len: 0.62, w: 0.075, off: 0.25 },
    ];
    rings.forEach((r, ri) => {
      for (let i = 0; i < r.n; i++) {
        const a = ((i + r.off) / r.n) * Math.PI * 2 + seed;
        ctx.save();
        ctx.rotate(a);
        const len = s * r.len * open;
        const w = s * r.w * open;
        const g = ctx.createLinearGradient(0, 0, 0, -len);
        g.addColorStop(0, pal[0]);
        g.addColorStop(1, pal[1]);
        ctx.fillStyle = ri === 2 ? pal[0] : g;
        petalPath(len, w, 0.1);
        ctx.fill();
        ctx.restore();
      }
    });
    // centro
    const cr = s * 0.2 * open;
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, cr);
    cg.addColorStop(0, '#5a2d12');
    cg.addColorStop(0.7, '#3a1a0a');
    cg.addColorStop(1, '#8a5a1a');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, cr, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2c14e';
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * cr * 0.78, Math.sin(a) * cr * 0.78, s * 0.018 + .4, 0, 7);
      ctx.fill();
    }
    ctx.fillStyle = '#f7d774';
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 + .3;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * cr * 0.4, Math.sin(a) * cr * 0.4, s * 0.014 + .3, 0, 7);
      ctx.fill();
    }
  }

  function azaleaBloom(s, pal, open, seed) {
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + seed;
      ctx.save();
      ctx.rotate(a);
      const len = s * open;
      const w = s * 0.62 * open;
      const g = ctx.createRadialGradient(0, 0, 0, 0, -len * 0.5, len);
      g.addColorStop(0, '#f0a800');
      g.addColorStop(0.35, pal[0]);
      g.addColorStop(1, pal[1]);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(w * 1.1, -len * 0.3, w * 0.95, -len * 1.05, 0, -len * 0.92);
      ctx.bezierCurveTo(-w * 0.95, -len * 1.05, -w * 1.1, -len * 0.3, 0, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,130,0,.25)';
      ctx.lineWidth = 0.7;
      ctx.stroke();
      // motitas del pétalo superior
      if (i === 0) {
        ctx.fillStyle = 'rgba(200,110,0,.5)';
        for (let k = 0; k < 7; k++) {
          ctx.beginPath();
          ctx.arc(rand(-w * .3, w * .3), -len * rand(.2, .6), s * 0.02 + .4, 0, 7);
          ctx.fill();
        }
      }
      ctx.restore();
    }
    // estambres largos
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + seed + 0.6;
      const l = s * 0.95 * open;
      const x = Math.cos(a) * l, y = Math.sin(a) * l;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(x * 0.3, y * 0.3 - s * 0.2 * open, x, y);
      ctx.strokeStyle = '#fff6c2';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#c96a12';
      ctx.beginPath(); ctx.arc(x, y, s * 0.045 + .5, 0, 7); ctx.fill();
    }
  }

  function drawAzalea(s, pal, open, seed) {
    // racimo de 3 flores
    const spots = [
      [0, 0, 1, 0],
      [-s * 0.95, s * 0.5, 0.78, 1.1],
      [s * 0.9, s * 0.45, 0.72, 2.2],
    ];
    spots.forEach(([dx, dy, k, rot]) => {
      ctx.save();
      ctx.translate(dx * open, dy * open);
      azaleaBloom(s * 0.72 * k, pal, open, seed + rot);
      ctx.restore();
    });
  }

  /* ---------- Flores ---------- */
  const flowers = [];
  const TYPES = ['lily', 'gerbera', 'azalea'];

  function makeFlower(x, headY, type, delay) {
    const pal = type === 'lily' ? pick(LILY) : type === 'gerbera' ? pick(GERBERA) : pick(AZALEA);
    const size = type === 'lily' ? rand(46, 64) : type === 'gerbera' ? rand(42, 58) : rand(30, 40);
    const scale = Math.min(1, Math.max(0.62, Math.min(W, 900) / 900 + 0.25));
    return {
      x0: x + rand(-6, 6),
      x1: x + rand(-40, 40),
      y1: headY,
      lean: rand(-60, 60),
      type, pal,
      size: size * scale,
      seed: rand(0, 6.28),
      ph: rand(0, 6.28),
      start: performance.now(),
      delay,
      growDur: rand(1500, 2300),
      bloomDur: rand(1300, 1800),
      leaves: [
        { t: rand(0.2, 0.32), side: 1, len: rand(38, 60) },
        { t: rand(0.42, 0.55), side: -1, len: rand(38, 60) },
        { t: rand(0.62, 0.74), side: 1, len: rand(30, 46) },
      ],
    };
  }

  function stemPoint(f, t, time) {
    const y0 = H + 8;
    const cx = f.x0 + f.lean, cy = (y0 + f.y1) / 2;
    const u = 1 - t;
    const sway = Math.sin(time / 1500 + f.ph) * 5 * t * t;
    return {
      x: u * u * f.x0 + 2 * u * t * cx + t * t * f.x1 + sway,
      y: u * u * y0 + 2 * u * t * cy + t * t * f.y1,
    };
  }

  function drawLeaf(len, w, growth) {
    ctx.save();
    ctx.scale(growth, growth);
    const g = ctx.createLinearGradient(0, 0, 0, -len);
    g.addColorStop(0, '#1f6b43');
    g.addColorStop(1, '#4fae6a');
    ctx.fillStyle = g;
    petalPath(len, w, 0.7);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -len * 0.85);
    ctx.strokeStyle = 'rgba(20,70,40,.5)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  }

  function drawFlower(f, time) {
    const el = time - f.start - f.delay;
    if (el < 0) return;
    const g = easeOut(clamp(el / f.growDur));
    const b = clamp((el - f.growDur * 0.85) / f.bloomDur);

    // tallo
    const n = 40;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const p = stemPoint(f, (i / n) * g, time);
      i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
    }
    ctx.strokeStyle = '#2f8a52';
    ctx.lineWidth = 3.2;
    ctx.lineCap = 'round';
    ctx.stroke();

    // hojas
    f.leaves.forEach(l => {
      if (g < l.t + 0.05) return;
      const p = stemPoint(f, l.t, time);
      const p2 = stemPoint(f, l.t + 0.02, time);
      const ang = Math.atan2(p2.y - p.y, p2.x - p.x) + Math.PI / 2;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ang + l.side * 0.95);
      drawLeaf(l.len, l.len * 0.22, easeOut(clamp((g - l.t) * 3)));
      ctx.restore();
    });

    // capullo / flor
    const head = stemPoint(f, g, time);
    const pAhead = stemPoint(f, Math.max(0, g - 0.03), time);
    const tilt = Math.atan2(head.x - pAhead.x, -(head.y - pAhead.y)) * 0.4;
    ctx.save();
    ctx.translate(head.x, head.y);
    ctx.rotate(tilt + Math.sin(time / 1300 + f.ph) * 0.04);

    if (b <= 0) {
      // capullo
      const bs = f.size * 0.22 * g;
      ctx.fillStyle = f.type === 'azalea' ? '#f0b800' : f.pal[1];
      ctx.beginPath();
      ctx.ellipse(0, -bs * 0.6, bs * 0.7, bs * 1.2, 0, 0, 7);
      ctx.fill();
      ctx.fillStyle = '#2f8a52';
      ctx.beginPath();
      ctx.ellipse(0, 0, bs * 0.6, bs * 0.45, 0, 0, 7);
      ctx.fill();
    } else {
      const open = easeBack(b);
      // halo suave
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, f.size * 1.6 * open);
      glow.addColorStop(0, 'rgba(255,225,150,.22)');
      glow.addColorStop(1, 'rgba(255,225,150,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0, 0, f.size * 1.6 * open, 0, 7); ctx.fill();

      // semilla fija para que las pecas no parpadeen
      ctx.save();
      ctx.rotate(Math.sin(time / 4000 + f.ph) * 0.05);
      if (f.type === 'lily') drawLily(f.size, f.pal, open, f.seed);
      else if (f.type === 'gerbera') drawGerbera(f.size, f.pal, open, f.seed);
      else drawAzalea(f.size, f.pal, open, f.seed);
      ctx.restore();
    }
    ctx.restore();
  }

  /* ---------- Luciérnagas ---------- */
  const flies = Array.from({ length: 34 }, () => ({
    x: rand(0, 1), y: rand(0.2, 1), r: rand(1, 2.6), sp: rand(0.02, 0.07), ph: rand(0, 6.28),
  }));
  function drawFlies(time) {
    flies.forEach(p => {
      const x = (p.x * W + Math.sin(time / 2500 + p.ph) * 26 + W) % W;
      const y = p.y * H - ((time * p.sp * 0.02) % (H * 0.4)) + Math.cos(time / 2100 + p.ph) * 14;
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time / 700 + p.ph));
      const g = ctx.createRadialGradient(x, y, 0, x, y, p.r * 7);
      g.addColorStop(0, `rgba(255,232,150,${a})`);
      g.addColorStop(1, 'rgba(255,232,150,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, p.r * 7, 0, 7); ctx.fill();
    });
  }

  /* ---------- Pasto ---------- */
  let grass = [];
  function buildGrass() {
    grass = [];
    const n = Math.ceil(W / 7);
    for (let i = 0; i < n; i++) {
      grass.push({ x: i * 7 + rand(-3, 3), h: rand(14, 44), w: rand(2, 4), ph: rand(0, 6.28), c: pick(['#1c5a3a', '#236b45', '#174c31']) });
    }
  }
  buildGrass();
  window.addEventListener('resize', buildGrass);
  function drawGrass(time) {
    grass.forEach(b => {
      const sw = Math.sin(time / 1400 + b.ph) * 4;
      ctx.beginPath();
      ctx.moveTo(b.x - b.w, H + 2);
      ctx.quadraticCurveTo(b.x + sw * 0.4, H - b.h * 0.55, b.x + sw, H - b.h);
      ctx.quadraticCurveTo(b.x + sw * 0.4 + b.w * 0.6, H - b.h * 0.5, b.x + b.w, H + 2);
      ctx.fillStyle = b.c;
      ctx.fill();
    });
  }

  /* ---------- Texto ---------- */
  function buildTitle() {
    const text = 'Te amo Erika';
    titleEl.innerHTML = '';
    [...text].forEach((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch;
      s.style.transitionDelay = (i * 0.12) + 's';
      titleEl.appendChild(s);
    });
    titleEl.setAttribute('aria-label', text);
  }
  buildTitle();

  /* ---------- Interacción ---------- */
  let started = false;

  function firstBloom() {
    const count = Math.max(10, Math.min(24, Math.round(W / 62)));
    const minY = H * 0.36, maxY = H * 0.68;
    for (let i = 0; i < count; i++) {
      const x = (i + 0.5) / count * W + rand(-18, 18);
      // los del centro un poco más altos, los de los lados más bajos
      const center = 1 - Math.abs((x / W) - 0.5) * 1.2;
      const y = maxY - (maxY - minY) * clamp(center * rand(0.55, 1));
      flowers.push(makeFlower(x, y, TYPES[i % 3], i * 130 + rand(0, 200)));
    }
    // segunda capa, más bajita, para rellenar
    for (let i = 0; i < Math.floor(count * 0.8); i++) {
      const x = rand(0.02, 0.98) * W;
      flowers.push(makeFlower(x, rand(H * 0.68, H * 0.82), pick(TYPES), 900 + i * 110 + rand(0, 250)));
    }
    flowers.sort((a, b) => a.y1 - b.y1);
    setTimeout(() => titleEl.classList.add('on'), 1500);
    setTimeout(() => hintEl.classList.add('on'), 6200);
  }

  function onPress(e) {
    const pt = e.touches ? e.touches[0] : e;
    if (!started) {
      started = true;
      startEl.classList.add('gone');
      firstBloom();
      return;
    }
    const y = Math.max(H * 0.3, Math.min(pt.clientY, H - 40));
    flowers.push(makeFlower(pt.clientX, y, pick(TYPES), 0));
    flowers.sort((a, b) => a.y1 - b.y1);
  }
  window.addEventListener('pointerdown', onPress);

  /* ---------- Bucle ---------- */
  function frame(time) {
    ctx.clearRect(0, 0, W, H);
    drawFlies(time);
    flowers.forEach(f => drawFlower(f, time));
    drawGrass(time);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
